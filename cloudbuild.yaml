# Cloud Build — use: gcloud builds submit . --config cloudbuild.yaml --region europe-west1
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 3600s
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/kb-api:latest
      - .
images:
  - europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/kb-api:latest
