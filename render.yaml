# Render free tier — Postgres + Python web (BM25 + Gemini; no paid Qdrant/ML).
databases:
  - name: knowledge-base-db
    plan: free
    databaseName: trust_rag
    user: trust_rag

services:
  - type: web
    name: knowledge-base-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render-free.txt
    startCommand: sh scripts/start_cloudrun.sh
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: DATABASE_URL
        fromDatabase:
          name: knowledge-base-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: BOOTSTRAP_USER_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://knowledge-base-trust-rag.vercel.app,http://127.0.0.1:5173,http://localhost:5173
      - key: ALLOWED_HOSTS
        value: "*"
      - key: AUTH_MODE
        value: password
      - key: DOCUMENT_STORAGE_BACKEND
        value: local
      - key: VECTOR_SEARCH_ENABLED
        value: "false"
      - key: RERANKER_ENABLED
        value: "false"
      - key: EVIDENCE_EXTRACTION_ENABLED
        value: "false"
      - key: EVIDENCE_GRAPH_ENABLED
        value: "false"
      - key: TEMPORAL_API_ENABLED
        value: "false"
      - key: CLAIM_VERIFICATION_ENABLED
        value: "false"
