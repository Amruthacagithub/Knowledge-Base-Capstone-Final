QDRANT_URL: "https://YOUR-CLUSTER.cloud.qdrant.io"
QDRANT_COLLECTION: "enterprise_docs"
GEMINI_MODEL: "gemini-2.5-flash-lite"
GEMINI_MODEL_FALLBACK: "gemini-3.1-flash-lite,gemini-2.5-flash"
CORS_ORIGINS: "https://YOUR-FRONTEND.example"
ALLOWED_HOSTS: "YOUR-SERVICE.run.app"
AUTH_MODE: "password"
JWT_ISSUER: "trust-rag"
JWT_AUDIENCE: "trust-rag-api"
ACCESS_TOKEN_MINUTES: "30"
MODEL_DEVICE: "cpu"
DOCUMENT_STORAGE_BACKEND: "gcs"
GCS_DOCUMENT_BUCKET: "YOUR-PROJECT-trust-rag-documents"
GCS_DOCUMENT_PREFIX: "uploads"
DOCUMENT_CACHE_DIR: "/tmp/trust-rag-documents"
EVIDENCE_EXTRACTION_ENABLED: "false"
EVIDENCE_GRAPH_ENABLED: "false"
TEMPORAL_API_ENABLED: "false"
CLAIM_VERIFICATION_ENABLED: "false"
LOGIN_RATE_LIMIT_PER_MINUTE: "10"
SEARCH_RATE_LIMIT_PER_MINUTE: "60"